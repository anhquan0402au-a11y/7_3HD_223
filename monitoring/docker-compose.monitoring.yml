
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ${MON_DIR:-.}/prometheus.yml:/etc/prometheus/prometheus.yml
      - ${MON_DIR:-.}/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - ${MON_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning
      - ${MON_DIR:-.}/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - devops-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ${MON_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning
      - ${MON_DIR:-.}/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - devops-net
    restart: unless-stopped

networks:
  devops-net:
    external: true