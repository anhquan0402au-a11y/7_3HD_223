services:
  orderapi-prod:
    image: ${IMAGE}
    container_name: orderapi-prod
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiKey=${API_KEY:-prod-secret-key}
    networks:
      - devops-net
    restart: unless-stopped

networks:
  devops-net:
    external: true
